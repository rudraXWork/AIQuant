services:
  - type: web
    name: trade-insights-backend
    env: node
    rootDir: Website
    buildCommand: python3 -m pip install -r requirements.txt && npm install && MODEL_ROOT=/opt/render/project/src bash scripts/download-ml-assets.sh
    startCommand: npm run server
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_API_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: CLIENT_CODE
        sync: false
      - key: PASSWORD
        sync: false
      - key: TOTP_SECRET
        sync: false
      - key: MODEL_URL
        sync: false
      - key: TRANSFORMER_URL
        sync: false
      - key: MODEL_ROOT
        value: /opt/render/project/src
